model_list:
  # ──────────────────────────────────────────────
  # Anthropic — Claude Pro/Max subscription (OAuth)
  # Served by litellm-plugin/sitecustomize.py which injects a fresh OAuth
  # bearer token and the Claude Agent SDK identity on every call.
  # ──────────────────────────────────────────────
  - model_name: claude-opus
    litellm_params:
      model: anthropic/claude-opus-4-7
      api_key: os.environ/ANTHROPIC_OAUTH_TOKEN
    model_info:
      max_input_tokens: 200000
      max_output_tokens: 4096

  - model_name: claude-sonnet
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_OAUTH_TOKEN
    model_info:
      max_input_tokens: 200000
      max_output_tokens: 8192

  - model_name: claude-haiku
    litellm_params:
      model: anthropic/claude-haiku-4-5
      api_key: os.environ/ANTHROPIC_OAUTH_TOKEN
    model_info:
      max_input_tokens: 200000
      max_output_tokens: 8192

  # ──────────────────────────────────────────────
  # OpenAI — ChatGPT Plus/Pro via Codex Responses wire bridge
  # The bridge intercepts these before LiteLLM's provider routing; the
  # `openai/` prefix + dummy key exist only to satisfy config validation.
  # ──────────────────────────────────────────────
  - model_name: claude-gpt
    litellm_params:
      model: openai/gpt-5.6-terra
      api_key: dummy-codex-oauth
    model_info:
      mode: responses
      max_input_tokens: 272000
      max_output_tokens: 128000

  - model_name: claude-gpt-fast
    litellm_params:
      model: openai/gpt-5.6-luna
      api_key: dummy-codex-oauth
    model_info:
      mode: responses
      max_input_tokens: 272000
      max_output_tokens: 16384

  # ──────────────────────────────────────────────
  # Google — AI Pro/Ultra via Cloud Code (Antigravity) wire bridge
  # ──────────────────────────────────────────────
  - model_name: claude-gemini-pro
    litellm_params:
      model: openai/gemini-2.5-pro
      api_key: dummy-antigravity-oauth
    model_info:
      mode: antigravity
      max_input_tokens: 1000000
      max_output_tokens: 64000

  - model_name: claude-gemini-flash
    litellm_params:
      model: openai/gemini-2.5-flash
      api_key: dummy-antigravity-oauth
    model_info:
      mode: antigravity
      max_input_tokens: 1000000
      max_output_tokens: 64000

# Optional raw provider IDs — the bridges match on model substrings
# ("gpt-5", "codex", "gemini"), so calling these directly also works:
  - model_name: gemini-3-pro
    litellm_params:
      model: openai/gemini-3-pro
      api_key: dummy-antigravity-oauth
    model_info:
      mode: antigravity
      max_input_tokens: 1000000
      max_output_tokens: 64000

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
  drop_params: true
  set_verbose: false
